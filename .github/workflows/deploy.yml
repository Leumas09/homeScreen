# Tests à chaque push et pull request ; sur main, build de l'image, publication dans l'ACR du socle
# et mise à jour de la Container App, en OIDC et sans secret GitHub.
# Variables de dépôt (pas des secrets) : AZURE_CLIENT_ID (client de id-maroubra-ci), AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, APP_NAME.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: crkiwiapps.azurecr.io
  APP_NAME: ${{ vars.APP_NAME }}
  IMAGE: crkiwiapps.azurecr.io/${{ vars.APP_NAME }}:${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: |
          npx tsc --noEmit -p apps/hub
          npx tsc --noEmit -p apps/web
      - name: Tests (moteur du ciel contre Skyfield, serveur, sources, marée)
        run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Connexion Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Connexion au registre
        run: az acr login --name "${REGISTRY%%.*}"

      - name: Build et push
        run: |
          docker build --build-arg VERSION=${{ github.sha }} -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Mise à jour de la Container App
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "rg-app-$APP_NAME" \
            --image "$IMAGE" \
            --query "properties.latestRevisionName" -o tsv

      - name: Vérification du déploiement
        run: |
          for i in $(seq 1 30); do
            v=$(curl -sf "https://$APP_NAME.apps.akakiwi.com/health" | jq -r .version || true)
            [ "$v" = "${{ github.sha }}" ] && echo "Version servie : $v" && exit 0
            sleep 10
          done
          echo "La version servie n'est pas ${{ github.sha }}" && exit 1
